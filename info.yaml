# Tiny Tapeout project information
project:
title:        "Synchronous FIFO"
author:       "Your Name"
discord:      ""
description:  "8-bit synchronous FIFO with full, empty, almost-full, almost-empty and peak occupancy status"
language:     "Verilog"
clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_fifo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
- "FIFO_SYNCHRONOUS.v"
- "tt_um_fifo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
ui[0]: "Data In 0"
ui[1]: "Data In 1"
ui[2]: "Data In 2"
ui[3]: "Data In 3"
ui[4]: "Data In 4"
ui[5]: "Data In 5"
ui[6]: "Data In 6"
ui[7]: "Data In 7"



  # Outputs
uo[0]: "FIFO Data/Status 0"
uo[1]: "FIFO Data/Status 1"
uo[2]: "FIFO Data/Status 2"
uo[3]: "FIFO Data/Status 3"
uo[4]: "FIFO Data/Status 4"
uo[5]: "FIFO Data/Status 5"
uo[6]: "FIFO Data/Status 6"
uo[7]: "FIFO Data/Status 7"

  # Bidirectional pins
uio[0]: "Flush"
uio[1]: "Write Enable"
uio[2]: "Read Enable"
uio[3]: "Output Select"
uio[4]: ""
uio[5]: ""
uio[6]: ""
uio[7]: ""

# Do not change!
yaml_version: 6
